<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Poker Blind Timer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: 'Helvetica Neue', Arial, 'Apple SD Gothic Neo', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    height: 100dvh; /* 모바일 주소창 대응 */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  #level-label {
    font-size: clamp(14px, 3vw, 32px);
    letter-spacing: 0.3em;
    color: #888;
    margin-bottom: 2vh;
    text-transform: uppercase;
  }

  #timer {
    font-size: clamp(80px, 28vw, 360px);
    font-weight: 700;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
  }

  #blinds {
    font-size: clamp(28px, 8vw, 110px);
    margin-top: 2vh;
    letter-spacing: 0.05em;
    font-weight: 500;
  }

  #next {
    font-size: clamp(12px, 2.2vw, 24px);
    color: #666;
    margin-top: 3vh;
    letter-spacing: 0.1em;
    text-align: center;
    padding: 0 16px;
  }

  body.break #timer { color: #ffcc33; }
  body.break #blinds { color: #ffcc33; font-size: clamp(32px, 9vw, 130px); }
  body.break #level-label { color: #ffcc33; }

  body.warning #timer { color: #ff4444; }

  #controls {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 100;
  }
  .controls-row {
    display: flex;
    gap: 8px;
  }
  button {
    background: #1a1a1a;
    color: #fff;
    border: 1px solid #555;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 500;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: background 0.15s, border-color 0.15s;
    min-height: 44px; /* 터치 타겟 */
  }
  button:hover { background: #333; border-color: #888; }
  button:active { background: #444; }

  #btn-start { min-width: 110px; }
  #btn-start.running { background: #5a2020; border-color: #883333; }

  #btn-reset { background: #2a1a1a; }

  #btn-fullscreen {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    right: 12px;
    z-index: 100;
  }

  #level-counter {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    left: 16px;
    font-size: 14px;
    color: #555;
    letter-spacing: 0.1em;
  }

  /* 플레이어 패널 */
  #players-panel {
    position: fixed;
    bottom: max(12px, env(safe-area-inset-bottom));
    right: 16px;
    width: 320px;
    max-width: 40vw;
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid #333;
    border-radius: 12px;
    padding: 14px;
    z-index: 90;
    display: flex;
    flex-direction: column;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  #players-panel.collapsed .panel-body { display: none; }
  #players-panel.collapsed { width: auto; }

  #players-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #ddd;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
    cursor: pointer;
    gap: 8px;
  }
  #players-header-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  #players-count { color: #ffcc33; }
  #total-buyin {
    font-size: 13px;
    color: #4ade80;
    font-weight: 500;
  }

  /* 칩 설정 칸 */
  #chip-config {
    background: rgba(0,0,0,0.3);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .chip-config-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #bbb;
  }
  .chip-label {
    min-width: 56px;
    color: #999;
  }
  .chip-config-row input {
    flex: 1;
    min-width: 0;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #fff;
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    text-align: right;
    -moz-appearance: textfield;
  }
  .chip-config-row input::-webkit-outer-spin-button,
  .chip-config-row input::-webkit-inner-spin-button {
    -webkit-appearance: none; margin: 0;
  }
  .chip-config-row input:focus { outline: none; border-color: #888; }
  .chip-unit { color: #888; font-size: 12px; min-width: 50px; }

  #total-chip {
    margin-top: 4px;
    padding-top: 8px;
    border-top: 1px solid #2a2a2a;
    font-size: 14px;
    color: #ddd;
    font-weight: 600;
    text-align: center;
  }
  #total-chip-value { color: #60a5fa; font-size: 16px; }
  #players-toggle {
    background: transparent;
    border: none;
    color: #888;
    font-size: 18px;
    padding: 0 4px;
    min-height: auto;
    cursor: pointer;
  }

  .panel-body {
    overflow: visible;
    flex: none;
  }

  .player-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .player-row input.name {
    flex: 1;
    min-width: 0;
    background: #1a1a1a;
    border: 1px solid #444;
    color: #fff;
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  .player-row input.name:focus { outline: none; border-color: #888; }
  .player-row .buyin {
    min-width: 36px;
    text-align: center;
    color: #ffcc33;
    font-weight: 600;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  .player-row button.pm {
    background: #1a1a1a;
    border: 1px solid #555;
    color: #fff;
    width: 32px;
    height: 32px;
    min-height: 32px;
    padding: 0;
    font-size: 16px;
    border-radius: 6px;
    flex-shrink: 0;
  }
  .player-row button.pm:active { background: #444; }
  .player-row button.del {
    background: transparent;
    border: none;
    color: #666;
    font-size: 16px;
    padding: 0 4px;
    min-height: auto;
    flex-shrink: 0;
  }
  .player-row button.del:hover { color: #ff6666; }

  #btn-add-player {
    width: 100%;
    margin-top: 8px;
    background: #1a3a1a;
    border-color: #336633;
    padding: 10px;
    font-size: 14px;
  }
  #btn-add-player:hover { background: #2a5a2a; }

  #online-room {
    background: rgba(0,0,0,0.35);
    border: 1px solid #2a2a2a;
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 10px;
  }
  #room-actions { display: flex; gap: 6px; }
  #room-actions button { flex: 1; padding: 9px; min-height: 38px; font-size: 13px; }
  #btn-create-room { background: #172554; border-color: #29458a; }
  #btn-recover-room { background: #262626; border-color: #555; }
  #active-room-actions { display: none; gap: 6px; margin-top: 8px; }
  #active-room-actions button { flex: 1; min-height: 36px; padding: 7px; font-size: 12px; }
  body.admin-locked .admin-control { opacity: .45; cursor: not-allowed; }
  #btn-show-qr { background: #1a3a1a; border-color: #336633; }
  #btn-end-room { background: #3b1717; border-color: #713333; }
  .room-setting { display: none; align-items: center; gap: 7px; margin-top: 8px; color: #aaa; font-size: 12px; }
  .room-setting select { flex: 1; min-height: 32px; background: #181818; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 4px 7px; }
  #room-status { color: #888; font-size: 12px; line-height: 1.45; margin-top: 7px; overflow-wrap: anywhere; }
  #room-status.connected { color: #4ade80; }
  #room-share { display: none; position: fixed; inset: 0; z-index: 500; background: rgba(0,0,0,.78); align-items: center; justify-content: center; padding: 24px; }
  #room-share.open { display: flex; }
  #qr-dialog { width: min(360px, 92vw); background: #141414; border: 1px solid #444; border-radius: 16px; padding: 22px; text-align: center; box-shadow: 0 24px 80px #000; }
  #room-code { color: #facc15; font-size: 20px; font-weight: 800; letter-spacing: .18em; }
  #admin-pin { margin-top: 7px; color: #60a5fa; font-size: 14px; font-weight: 700; letter-spacing: .12em; }
  #qr-code { width: 148px; height: 148px; margin: 10px auto; padding: 8px; background: white; border-radius: 8px; }
  #qr-code img, #qr-code canvas { width: 100% !important; height: 100% !important; }
  #join-url { color: #888; font-size: 10px; line-height: 1.35; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  #btn-close-qr { width: 100%; margin-top: 14px; padding: 9px; min-height: 40px; }
  #event-toast { display: none; position: fixed; top: max(88px, calc(env(safe-area-inset-top) + 76px)); left: 50%; transform: translateX(-50%); z-index: 600; min-width: 260px; max-width: 80vw; background: #1b1b1b; border: 1px solid #666; border-radius: 12px; padding: 13px 16px; box-shadow: 0 12px 44px #000; text-align: center; color: #fff; }
  #event-toast.show { display: block; animation: toast-in .2s ease-out; }
  #event-toast button { margin-left: 10px; min-height: 30px; padding: 4px 9px; font-size: 11px; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, -8px); } }

  @media (max-width: 600px) {
    #players-panel { width: 260px; max-width: 70vw; padding: 10px; }
    .player-row input.name { font-size: 13px; padding: 6px 8px; }
    .player-row button.pm { width: 28px; height: 28px; min-height: 28px; font-size: 14px; }
  }

  /* 모바일 세로화면 - 버튼 크기 살짝 줄이고 한 줄로 */
  @media (max-width: 600px) {
    button { padding: 10px 12px; font-size: 13px; }
    #btn-start { min-width: 80px; }
  }


</style>

<div id="controls">

        <option value="14">레벨 13 종료 · 30,000 / 60,000</option><option value="15">레벨 14 종료 · 40,000 / 80,000</option>

        <option value="6">최대 6회</option><option value="7">최대 7회</option>

<script src="./vendor/supabase-js.min.js"></script>

<script src="./supabase-config.js"></script>
<script src="./poker-core.js"></script>
<script>
const LEVELS = PokerCore.LEVELS;

let currentLevel = 0;
let remainingMs = LEVELS[0].minutes * 60 * 1000;
let endTime = null; // 절대 시간 기준 (화면 꺼져도 정확)
let running = false;
let intervalId = null;
let serverClockOffsetMs = 0;

function clockNow() { return Date.now() + serverClockOffsetMs; }

const $timer = document.getElementById('timer');
const $blinds = document.getElementById('blinds');
const $next = document.getElementById('next');
const $label = document.getElementById('level-label');
const $counter = document.getElementById('level-counter');
const $btnStart = document.getElementById('btn-start');

function fmt(n) { return n.toLocaleString('en-US'); }

function getBlindNumber(idx) {
  return PokerCore.blindNumber(idx);
}

function findNextBlind(idx) {
  for (let i = idx + 1; i < LEVELS.length; i++) {
    if (LEVELS[i].type === 'blind') return LEVELS[i];
  }
  return null;
}

let lastDisplayedSec = -1;

function saveTimerState(syncOnline = true) {
  const state = {
    currentLevel,
    remainingMs: running && endTime != null ? Math.max(0, endTime - clockNow()) : remainingMs,
    endTime,
    running,
    savedAt: clockNow(),
  };
  try { localStorage.setItem('poker_timer_state', JSON.stringify(state)); } catch (e) {}
  if (syncOnline && onlineRoom && isRoomOwner) syncRoomTimer();
}

function loadTimerState() {
  try {
    const state = JSON.parse(localStorage.getItem('poker_timer_state') || 'null');
    if (!state || !Number.isInteger(state.currentLevel) || state.currentLevel < 0 || state.currentLevel >= LEVELS.length) return;
    currentLevel = state.currentLevel;
    running = Boolean(state.running);
    endTime = running && Number.isFinite(state.endTime) ? state.endTime : null;
    remainingMs = running && endTime != null
      ? endTime - clockNow()
      : Math.max(0, Number(state.remainingMs) || 0);
  } catch (e) {}
}

function updateRunningUi() {
  $btnStart.textContent = running ? '⏸ 일시정지' : (remainingMs > 0 ? '▶ 재개' : '▶ 시작');
  $btnStart.classList.toggle('running', running);
}

function advanceExpiredLevels(now = clockNow()) {
  const result = PokerCore.advanceExpired(currentLevel, remainingMs);
  currentLevel = result.currentLevel;
  remainingMs = result.remainingMs;
  if (result.finished) {
    running = false;
    endTime = null;
    remainingMs = 0;
    if (intervalId) { clearInterval(intervalId); intervalId = null; }
    releaseAwake();
  } else if (running) {
    endTime = now + remainingMs;
  }
  if (result.advanced) lastDisplayedSec = -1;
  updateRunningUi();
  return result.advanced > 0;
}

function tick() {
  if (running && endTime != null) {
    remainingMs = endTime - clockNow();
    if (remainingMs <= 0) {
      // 레벨업 사운드
      beep(880, 0.15);
      setTimeout(() => beep(1175, 0.25), 180);
      // 진동
      vibrate([200, 100, 200]);
      advanceExpiredLevels();
      saveTimerState();
    }
  }

  const total = Math.max(0, Math.ceil(remainingMs / 1000));

  // 카운트다운 비프 (초가 바뀐 순간만)
  if (running && total !== lastDisplayedSec) {
    if (total <= 3 && total > 0) {
      beep(880, 0.12);
      vibrate(80);
    }
    lastDisplayedSec = total;
  }

  render(total);
}

function render(total) {
  if (total == null) total = Math.max(0, Math.ceil(remainingMs / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  $timer.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');

  const lvl = LEVELS[currentLevel];
  if (lvl.type === 'break') {
    document.body.classList.add('break');
    $label.textContent = 'BREAK TIME';
    $blinds.textContent = '☕ 휴식 ☕';
    const nb = findNextBlind(currentLevel);
    $next.textContent = nb ? `NEXT: ${fmt(nb.sb)} / ${fmt(nb.bb)}` : '';
  } else {
    document.body.classList.remove('break');
    const num = getBlindNumber(currentLevel);
    $label.textContent = `LEVEL ${num}`;
    $blinds.textContent = `${fmt(lvl.sb)} / ${fmt(lvl.bb)}`;
    const nxt = LEVELS[currentLevel + 1];
    if (!nxt) $next.textContent = '— 마지막 레벨 —';
    else if (nxt.type === 'break') $next.textContent = 'NEXT: BREAK (5분)';
    else $next.textContent = `NEXT: ${fmt(nxt.sb)} / ${fmt(nxt.bb)}`;
  }

  if (total <= 3 && total > 0 && running) document.body.classList.add('warning');
  else document.body.classList.remove('warning');

  $counter.textContent = `${currentLevel + 1} / ${LEVELS.length}`;
}

function start() {
  if (onlineRoom && !isRoomOwner) return;
  if (running) return;
  unlockAudio(); // 모바일 오디오 잠금 해제
  running = true;
  endTime = clockNow() + remainingMs;
  $btnStart.textContent = '⏸ 일시정지';
  $btnStart.classList.add('running');
  keepAwake();
  if (intervalId) clearInterval(intervalId);
  intervalId = setInterval(tick, 100);
  tick();
  saveTimerState();
}
function pause() {
  if (onlineRoom && !isRoomOwner) return;
  if (!running) return;
  remainingMs = Math.max(0, endTime - clockNow());
  running = false;
  endTime = null;
  $btnStart.textContent = '▶ 재개';
  $btnStart.classList.remove('running');
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  releaseAwake();
  updateRunningUi();
  saveTimerState();
}
function toggle() { running ? pause() : start(); }

function goNext() {
  if (onlineRoom && !isRoomOwner) return;
  if (currentLevel < LEVELS.length - 1) {
    currentLevel++;
    remainingMs = LEVELS[currentLevel].minutes * 60 * 1000;
    if (running) endTime = clockNow() + remainingMs;
  } else {
    pause();
    remainingMs = 0;
  }
  lastDisplayedSec = -1;
  render();
  updateRunningUi();
  saveTimerState();
}
function goPrev() {
  if (onlineRoom && !isRoomOwner) return;
  if (currentLevel > 0) currentLevel--;
  remainingMs = LEVELS[currentLevel].minutes * 60 * 1000;
  if (running) endTime = clockNow() + remainingMs;
  lastDisplayedSec = -1;
  render();
  saveTimerState();
}
function reset() {
  if (onlineRoom && !isRoomOwner) return;
  pause();
  currentLevel = 0;
  remainingMs = LEVELS[0].minutes * 60 * 1000;
  lastDisplayedSec = -1;
  render();
  updateRunningUi();
  saveTimerState();
}

// ===== 오디오 (모바일 대응) =====
let audioCtx = null;
let audioUnlocked = false;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!audioUnlocked) {
      // 무음 한 번 재생으로 잠금 해제
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      g.gain.value = 0;
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + 0.01);
      audioUnlocked = true;
    }
  } catch (e) {}
}
function beep(freq, dur) {
  try {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    g.gain.value = 0.25;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

let wakeLock = null;
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {}
}
function releaseAwake() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
// 탭이 다시 활성화되면 wake lock 재요청
document.addEventListener('visibilitychange', () => {

function renderPlayers() {

  }

  const totalMoney = totalBuyins * BUYIN_UNIT;
  $totalBuyin.textContent = `총 바인: ${totalMoney.toLocaleString('en-US')}원 (${totalBuyins}회)`;

  // 총 칩 계산: 각 플레이어의 첫 1회는 firstChip, 2회째부터는 rebuyChip
  const firstChip = parseFloat($chipFirst.value) || 0;
  const rebuyChip = parseFloat($chipRebuy.value) || 0;
  let totalChip = 0;
  players.forEach(p => {
    const b = p.buyin || 0;
    if (b >= 1) {
      totalChip += firstChip;
      totalChip += (b - 1) * rebuyChip;

  $totalChipValue.textContent = (Math.round(totalChip * 100) / 100).toLocaleString('en-US');

async function calibrateServerClock() {
  let best = null;
  for (let i = 0; i < 5; i++) {
    const started = Date.now();
    const { data, error } = await onlineDb.rpc('poker_server_time_ms');
    const finished = Date.now();
    if (!error && Number.isFinite(Number(data))) {
      const sample = { rtt: finished - started, offset: Number(data) - ((started + finished) / 2) };
      if (!best || sample.rtt < best.rtt) best = sample;
    }
  }
  // 왕복 지연이 크면 오히려 오차가 커질 수 있으므로 기기 자동 시각을 사용합니다.
  serverClockOffsetMs = best && best.rtt <= 1000 ? best.offset : 0;
}

function randomRoomCode() {

  if (error) setRoomStatus(`삭제 실패: ${error.message}`);

function subscribeRoom() {
  if (onlineChannel) onlineDb.removeChannel(onlineChannel);
  onlineChannel = onlineDb.channel(`room-${onlineRoom.id}`)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'poker_rooms', filter: `id=eq.${onlineRoom.id}` }, payload => {
      onlineRoom = payload.new;
      const wasOwner = isRoomOwner;
      isRoomOwner = onlineRoom.owner_id === onlineUserId;
      applyRoomTimer(onlineRoom);
      setAdminControls();
      if (wasOwner && !isRoomOwner) {
        clearTimeout(roomSyncTimer);
        adminPin = null;
        $adminPin.textContent = '관리자 PIN은 현재 관리자 기기에만 표시됩니다';
        const saved = JSON.parse(localStorage.getItem('poker_online_room') || 'null');
        if (saved) localStorage.setItem('poker_online_room', JSON.stringify({ id: saved.id, code: saved.code, pin: null }));
        setRoomStatus('관리 권한이 다른 기기로 이전되었습니다. 이 화면의 관리 기능은 잠겼습니다.', true);
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'poker_players', filter: `room_id=eq.${onlineRoom.id}` }, () => fetchOnlinePlayers())
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'poker_events', filter: `room_id=eq.${onlineRoom.id}` }, payload => handleNewEvent(payload.new))
    .subscribe(state => {
      if (state === 'CHANNEL_ERROR') setRoomStatus('실시간 연결이 끊겼습니다. 페이지를 새로고침해주세요.');
    });
}
function timerRoomPayload() {
  const liveRemaining = running && endTime != null ? Math.max(0, endTime - clockNow()) : Math.max(0, remainingMs);
  return {
    current_level: currentLevel,
    timer_running: running,
    timer_ends_at: running && endTime != null ? new Date(endTime).toISOString() : null,
    timer_remaining_ms: Math.round(liveRemaining),
    updated_at: new Date().toISOString(),
  };
}
function syncRoomTimer() {
  if (!onlineRoom || !onlineDb || !isRoomOwner) return;
  clearTimeout(roomSyncTimer);
  roomSyncTimer = setTimeout(async () => {
    const payload = timerRoomPayload();
    const { error } = await onlineDb.from('poker_rooms').update(payload).eq('id', onlineRoom.id);
    if (!error) Object.assign(onlineRoom, payload);
    else setRoomStatus(`타이머 동기화 실패: ${error.message}`);
  }, 120);
}
function applyRoomTimer(room) {
  if (intervalId) { clearInterval(intervalId); intervalId = null; }
  currentLevel = Math.min(LEVELS.length - 1, Math.max(0, Number(room.current_level) || 0));
  running = Boolean(room.timer_running);
  endTime = running && room.timer_ends_at ? new Date(room.timer_ends_at).getTime() : null;
  remainingMs = running && endTime != null
    ? endTime - clockNow()
    : Math.max(0, Number(room.timer_remaining_ms) || LEVELS[currentLevel].minutes * 60000);
  if (running) {
    advanceExpiredLevels();
    intervalId = setInterval(tick, 100);
  }
  updateRunningUi();
  render();
  saveTimerState(false);
}
function showEventToast(event) {
  clearTimeout(eventToastTimer);
  $eventToast.innerHTML = '';
  const text = document.createElement('span');
  text.textContent = event.event_type === 'join' ? `♠ ${event.player_name}님이 참가했습니다` : `💰 ${event.player_name}님이 리바인했습니다`;
  $eventToast.appendChild(text);
  if (event.event_type === 'rebuy') {
    const undo = document.createElement('button');

    undo.addEventListener('click', () => undoRebuy(event.id));
    $eventToast.appendChild(undo);
  }
  $eventToast.classList.add('show');
  beep(event.event_type === 'join' ? 660 : 880, 0.16);
  eventToastTimer = setTimeout(() => $eventToast.classList.remove('show'), 5000);
}
async function handleNewEvent(event) {
  if (event.event_type === 'join' || event.event_type === 'rebuy') showEventToast(event);
}
async function undoRebuy(eventId) {
  const { error } = await onlineDb.rpc('undo_poker_rebuy', { p_event_id: eventId });

    $eventToast.classList.remove('show');

}
async function useRoom(room, pin = adminPin) {
  onlineRoom = room;
  isRoomOwner = room.owner_id === onlineUserId;
  adminPin = pin || null;
  localStorage.setItem('poker_online_room', JSON.stringify({ id: room.id, code: room.code, pin: adminPin }));
  applyRoomTimer(room);
  setAdminControls();
  subscribeRoom();

}
async function createOnlineRoom() {
  if (!onlineDb) return;
  if (onlineRoom && !confirm('현재 방을 두고 새 게임 방을 만들까요?')) return;
  $createRoom.disabled = true;
  setRoomStatus('새 게임 방을 만드는 중…');
  try {
    const { data: userData, error: userError } = await onlineDb.auth.getUser();
    if (userError) throw userError;
    let created = null;
    const pin = randomAdminPin();
    for (let attempt = 0; attempt < 4 && !created; attempt++) {
      const timer = timerRoomPayload();
      const { data, error } = await onlineDb.rpc('create_poker_room_with_pin', {
        p_code: randomRoomCode(),
        p_pin: pin,
        p_rebuy_until_stage: Number($rebuyCutoff.value),
        p_max_rebuys: $rebuyLimit.value === '' ? null : Number($rebuyLimit.value),
        p_current_level: timer.current_level,
        p_timer_running: timer.timer_running,
        p_timer_ends_at: timer.timer_ends_at,
        p_timer_remaining_ms: timer.timer_remaining_ms,
      });
      if (!error) created = data;
      else if (error.code !== '23505') throw error;
    }
    if (!created) throw new Error('방 코드 생성에 실패했습니다. 다시 시도해주세요.');
    await useRoom(created, pin);
    showQrDialog();
  } catch (error) { setRoomStatus(`방 생성 실패: ${error.message}`); }
  finally { $createRoom.disabled = false; }
}
async function recoverOnlineRoom() {
  if (!onlineDb) return;
  const code = prompt('복구할 6자리 방 코드를 입력하세요.')?.trim().toUpperCase();
  if (!code) return;
  const pin = prompt('방 생성 시 표시된 관리자 PIN 6자리를 입력하세요.')?.trim();
  if (!pin) return;
  $recoverRoom.disabled = true;
  setRoomStatus('게임 방 관리 권한을 복구하는 중…');
  try {
    const { data, error } = await onlineDb.rpc('recover_poker_room', { p_code: code, p_pin: pin });
    if (error) throw error;
    await useRoom(data, pin);
    showQrDialog();
  } catch (error) { setRoomStatus(`방 복구 실패: ${error.message}`); }
  finally { $recoverRoom.disabled = false; }
}
function showQrDialog() {
  if (onlineRoom) $roomShare.classList.add('open');
}
function closeQrDialog() {
  $roomShare.classList.remove('open');
}
async function endOnlineRoom() {
  if (!isRoomOwner) return;
  if (!onlineRoom || !confirm(`ROOM ${onlineRoom.code}를 종료할까요?\n참가자 명단도 함께 삭제됩니다.`)) return;
  document.getElementById('btn-end-room').disabled = true;
  try {
    const { error } = await onlineDb.from('poker_rooms').delete().eq('id', onlineRoom.id);
    if (error) throw error;
    if (onlineChannel) { await onlineDb.removeChannel(onlineChannel); onlineChannel = null; }
    onlineRoom = null;
    isRoomOwner = true;
    adminPin = null;
    players = [];
    reset();
    localStorage.removeItem('poker_online_room');
    closeQrDialog();
    $activeRoomActions.style.display = 'none';
    $rebuySetting.style.display = 'none';
    $rebuyLimitSetting.style.display = 'none';
    document.getElementById('room-actions').style.display = 'flex';
    $createRoom.textContent = '새 게임 방';
    renderPlayers();
    setRoomStatus('방이 종료되었습니다. 새 게임 방을 만들 수 있습니다.');
  } catch (error) { setRoomStatus(`방 종료 실패: ${error.message}`); }
  finally { document.getElementById('btn-end-room').disabled = false; }
}
async function initOnlineRoom() {
  if (!onlineConfigured()) {
    setRoomStatus('온라인 참가 미설정 · supabase-config.js에 프로젝트 정보를 입력하세요.');
    $createRoom.disabled = true;
    $recoverRoom.disabled = true;
    return;
  }
  try {
    const cfg = window.POKER_CONFIG;
    onlineDb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    let { data: userData, error: userError } = await onlineDb.auth.getUser();
    if (userError || !userData.user) {
      await onlineDb.auth.signOut({ scope: 'local' });
      const { data: auth, error } = await onlineDb.auth.signInAnonymously();
      if (error) throw error;
      userData = { user: auth.user };
    }
    onlineUserId = userData.user.id;
    await calibrateServerClock();
    $createRoom.disabled = false;
    setRoomStatus('연결 준비 완료 · 게임 방을 만들어주세요.');
    const saved = JSON.parse(localStorage.getItem('poker_online_room') || 'null');
    if (saved?.id) {
      const { data } = await onlineDb.from('poker_rooms').select('*').eq('id', saved.id).maybeSingle();
      if (data) await useRoom(data, saved.pin || null);
    }
  } catch (error) { setRoomStatus(`온라인 연결 실패: ${error.message}`); }
}
$createRoom.addEventListener('click', createOnlineRoom);
$recoverRoom.addEventListener('click', recoverOnlineRoom);
document.getElementById('btn-show-qr').addEventListener('click', showQrDialog);
document.getElementById('btn-close-qr').addEventListener('click', closeQrDialog);
document.getElementById('btn-end-room').addEventListener('click', endOnlineRoom);
$rebuyCutoff.addEventListener('change', async () => {
  if (!onlineRoom || !isRoomOwner) return;
  const value = Number($rebuyCutoff.value);
  const { error } = await onlineDb.from('poker_rooms').update({ rebuy_until_stage: value, updated_at: new Date().toISOString() }).eq('id', onlineRoom.id);
  if (error) setRoomStatus(`리바인 마감 저장 실패: ${error.message}`);
  else onlineRoom.rebuy_until_stage = value;
});
$rebuyLimit.addEventListener('change', async () => {
  if (!onlineRoom || !isRoomOwner) return;
  const value = $rebuyLimit.value === '' ? null : Number($rebuyLimit.value);
  const { error } = await onlineDb.from('poker_rooms').update({ max_rebuys: value, updated_at: new Date().toISOString() }).eq('id', onlineRoom.id);
  if (error) setRoomStatus(`리바인 제한 저장 실패: ${error.message}`);
  else onlineRoom.max_rebuys = value;
});
$roomShare.addEventListener('click', e => { if (e.target === $roomShare) closeQrDialog(); });
initOnlineRoom();

// 시간 조정 (분/초 감소·증가)
function adjustTime(deltaMs) {
  if (onlineRoom && !isRoomOwner) return;
  remainingMs += deltaMs;
  if (remainingMs < 1000) remainingMs = 1000; // 최소 1초는 남겨둡니다 (0이 되면 자동 레벨업 트리거)
  if (running) endTime = clockNow() + remainingMs;
  lastDisplayedSec = -1;
  render();
  saveTimerState();
}
document.getElementById('btn-minus-min').addEventListener('click', () => adjustTime(-60 * 1000));
document.getElementById('btn-plus-min').addEventListener('click', () => adjustTime(+60 * 1000));
document.getElementById('btn-minus-sec').addEventListener('click', () => adjustTime(-10 * 1000));
document.getElementById('btn-plus-sec').addEventListener('click', () => adjustTime(+10 * 1000));

loadTimerState();
updateRunningUi();
if (running) {
  advanceExpiredLevels();
  intervalId = setInterval(tick, 100);
  tick();
} else {
  render();
}
</script>
</body>
</html>
