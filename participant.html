<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>포커 게임 참가</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; background: #09090b; color: #fafafa; font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif; }
  body { display: flex; justify-content: center; padding: max(28px, env(safe-area-inset-top)) 20px max(28px, env(safe-area-inset-bottom)); }
  main { width: 100%; max-width: 430px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { color: #fbbf24; font-size: 13px; font-weight: 800; letter-spacing: .18em; }
  h1 { margin: 10px 0 8px; font-size: clamp(34px, 10vw, 48px); line-height: 1.05; }
  .sub { color: #a1a1aa; margin: 0 0 30px; line-height: 1.55; }
  .card { background: #18181b; border: 1px solid #303036; border-radius: 20px; padding: 22px; box-shadow: 0 18px 50px rgba(0,0,0,.35); }
  label { display: block; color: #d4d4d8; font-size: 14px; margin-bottom: 9px; }
  input { width: 100%; min-height: 54px; border: 1px solid #3f3f46; border-radius: 12px; background: #0f0f12; color: white; padding: 0 16px; font: inherit; font-size: 18px; outline: none; }
  input:focus { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.12); }
  button { width: 100%; min-height: 56px; margin-top: 14px; border: 0; border-radius: 12px; background: #fbbf24; color: #181000; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .secondary { background: #27272a; color: #fafafa; border: 1px solid #3f3f46; }
  #player-view { display: none; text-align: center; }
  .name { font-size: 30px; font-weight: 800; overflow-wrap: anywhere; }
  .count { margin: 20px 0 4px; font-size: 64px; font-weight: 900; color: #fbbf24; font-variant-numeric: tabular-nums; }
  .count-label { color: #a1a1aa; }
  #status { min-height: 24px; margin-top: 18px; color: #a1a1aa; text-align: center; font-size: 14px; }
  #status.error { color: #f87171; }
  #room-label { color: #71717a; margin-top: 24px; text-align: center; font-size: 13px; }
  #tournament-state { display: none; margin-bottom: 14px; padding: 16px 18px; background: #111114; border: 1px solid #29292e; border-radius: 16px; text-align: center; }
  #mobile-level { color: #a1a1aa; font-size: 13px; font-weight: 800; letter-spacing: .14em; }
  #mobile-timer { margin: 3px 0; font-size: 50px; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.03em; }
  #mobile-blinds { font-size: 20px; font-weight: 700; }
  #rebuy-state { margin-top: 8px; color: #4ade80; font-size: 12px; }
  #rebuy-state.closed { color: #f87171; }
</style>
</head>
<body>
<main>
  <div class="eyebrow">HOME POKER NIGHT</div>
  <h1>게임 참가</h1>
  <p class="sub">닉네임으로 참가한 뒤, 이 화면에서 직접 리바인할 수 있어요.</p>
  <section id="tournament-state">
    <div id="mobile-level">LEVEL 1</div>
    <div id="mobile-timer">07:00</div>
    <div id="mobile-blinds">100 / 200</div>
    <div id="rebuy-state">리바인 가능</div>
  </section>
  <section class="card">
    <div id="join-view">
      <label for="nickname">이름 또는 닉네임</label>
      <input id="nickname" maxlength="20" autocomplete="nickname" placeholder="예: 포커왕" autofocus>
      <button id="join-btn">참가하기</button>
    </div>
    <div id="player-view">
      <div class="name" id="player-name"></div>
      <div class="count" id="buyin-count">1</div>
      <div class="count-label">현재 바인 횟수</div>
      <button id="rebuy-btn">리바인</button>
      <button id="refresh-btn" class="secondary">정보 새로고침</button>
      <button id="leave-btn" class="secondary">게임 나가기</button>
    </div>
    <div id="status">게임 방을 확인하고 있어요…</div>
  </section>
  <div id="room-label"></div>
</main>
<script src="./vendor/supabase-js.min.js"></script>
<script src="./supabase-config.js"></script>
<script src="./poker-core.js"></script>
<script>
const config = window.POKER_CONFIG || {};
const code = new URLSearchParams(location.search).get('room')?.trim().toUpperCase();
const $ = id => document.getElementById(id);
let db, room, player, channel;
let roomTimerInterval = null;
let serverClockOffsetMs = 0;
const LEVELS = PokerCore.LEVELS;

function configured() {
  return config.supabaseUrl && config.supabaseAnonKey && !config.supabaseUrl.includes('YOUR_PROJECT') && !config.supabaseAnonKey.includes('YOUR_');
}
function status(message, error = false) {
  $('status').textContent = message;
  $('status').classList.toggle('error', error);
}
function fmt(n) { return Number(n).toLocaleString('en-US'); }
function clockNow() { return Date.now() + serverClockOffsetMs; }
async function calibrateServerClock() {
  let best = null;
  for (let i = 0; i < 5; i++) {
    const started = Date.now();
    const { data, error } = await db.rpc('poker_server_time_ms');
    const finished = Date.now();
    if (!error && Number.isFinite(Number(data))) {
      const sample = { rtt: finished - started, offset: Number(data) - ((started + finished) / 2) };
      if (!best || sample.rtt < best.rtt) best = sample;
    }
  }
  serverClockOffsetMs = best && best.rtt <= 1000 ? best.offset : 0;
}
function blindNumber(stage) {
  return PokerCore.blindNumber(stage);
}
function rebuyOpen() {
  return room && PokerCore.rebuyStatus({
    currentLevel: room.current_level,
    rebuyUntilStage: room.rebuy_until_stage,
    buyin: player?.buyin,
    maxRebuys: room.max_rebuys,
  }).open;
}
function rebuyLimitReached() {
  return player && PokerCore.rebuyStatus({
    currentLevel: room?.current_level,
    rebuyUntilStage: room?.rebuy_until_stage,
    buyin: player.buyin,
    maxRebuys: room?.max_rebuys,
  }).limited;
}
function renderRoomTimer() {
  if (!room) return;
  const stage = Math.min(LEVELS.length - 1, Math.max(0, Number(room.current_level) || 0));
  const level = LEVELS[stage];
  let ms = Number(room.timer_remaining_ms) || level.minutes * 60000;
  if (room.timer_running && room.timer_ends_at) ms = Math.max(0, new Date(room.timer_ends_at).getTime() - clockNow());
  $('mobile-timer').textContent = PokerCore.formatMs(ms);
  $('mobile-level').textContent = level.type === 'break' ? 'BREAK TIME' : `LEVEL ${blindNumber(stage)}`;
  $('mobile-blinds').textContent = level.type === 'break' ? '☕ 휴식 ☕' : `${fmt(level.sb)} / ${fmt(level.bb)}`;
  const open = rebuyOpen();
  const limited = rebuyLimitReached();
  const used = player ? Math.max(0, Number(player.buyin) - 1) : 0;
  const limitText = room.max_rebuys == null ? '횟수 무제한' : `${used}/${room.max_rebuys}회`;
  $('rebuy-state').textContent = !open
    ? '리바인 마감'
    : limited ? `리바인 한도 도달 · ${limitText}` : `리바인 가능 · ${limitText} · 레벨 ${blindNumber(Number(room.rebuy_until_stage ?? 4))} 종료까지`;
  $('rebuy-state').classList.toggle('closed', !open || limited);
  $('rebuy-btn').disabled = !open || limited;
  $('rebuy-btn').textContent = !open ? '리바인 마감' : (limited ? '리바인 한도 도달' : '리바인');
  $('tournament-state').style.display = 'block';
}
function applyRoom(nextRoom) {
  room = nextRoom;
  renderRoomTimer();
  if (!roomTimerInterval) roomTimerInterval = setInterval(renderRoomTimer, 100);
}
function clearRoomTimer() {
  if (roomTimerInterval) clearInterval(roomTimerInterval);
  roomTimerInterval = null;
  $('tournament-state').style.display = 'none';
  $('mobile-level').textContent = 'LEVEL 1';
  $('mobile-timer').textContent = '07:00';
  $('mobile-blinds').textContent = '100 / 200';
}
async function refreshRoomState() {
  if (!db || !room?.id) return;
  const { data } = await db.from('poker_rooms').select('*').eq('id', room.id).maybeSingle();
  if (data) applyRoom(data);
  else clearRoomTimer();
}
function showPlayer() {
  $('join-view').style.display = 'none';
  $('player-view').style.display = 'block';
  $('player-name').textContent = player.name;
  $('buyin-count').textContent = player.buyin;
  renderRoomTimer();
  status('중앙 화면과 연결됨');
}
function showJoin(message) {
  player = null;
  $('player-view').style.display = 'none';
  $('join-view').style.display = 'block';
  $('nickname').value = '';
  status(message);
}
async function fetchPlayer(userId) {
  const { data, error } = await db.from('poker_players').select('*').eq('room_id', room.id).eq('user_id', userId).maybeSingle();
  if (error) throw error;
  player = data;
  if (player) showPlayer(); else status('닉네임을 입력해 참가하세요.');
}
async function init() {
  $('room-label').textContent = code ? `ROOM ${code}` : '';
  if (!code) return status('QR코드의 게임 방 정보가 없습니다.', true);
  if (!configured()) return status('아직 Supabase 연결 설정이 완료되지 않았습니다.', true);
  try {
    db = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    let { data: currentUser, error: currentUserError } = await db.auth.getUser();
    let user = currentUser?.user;
    if (currentUserError || !user) {
      await db.auth.signOut({ scope: 'local' });
      const { data: auth, error: authError } = await db.auth.signInAnonymously();
      if (authError) throw authError;
      user = auth.user;
    }
    await calibrateServerClock();
    const { data, error } = await db.from('poker_rooms').select('*').eq('code', code).maybeSingle();
    if (error) throw error;
    if (!data) return status('존재하지 않는 게임 방입니다.', true);
    applyRoom(data);
    if (!room.is_open) status('참가가 마감된 게임입니다.', true);
    await fetchPlayer(user.id);
    channel = db.channel(`participant-${room.id}-${user.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'poker_players', filter: `room_id=eq.${room.id}` }, payload => {
        const changed = payload.new;
        if (changed && player && changed.id === player.id) { player = changed; showPlayer(); }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'poker_players' }, payload => {
        if (player && Number(payload.old?.id) === Number(player.id)) {
          showJoin('게임 방이 종료되었거나 참가 등록이 취소되었습니다.');
        }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'poker_rooms', filter: `id=eq.${room.id}` }, () => {
        room.is_open = false;
        clearRoomTimer();
        showJoin('중앙에서 게임 방을 종료했습니다.');
      })
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'poker_rooms', filter: `id=eq.${room.id}` }, payload => {
        applyRoom(payload.new);
      }).subscribe();
  } catch (error) { status(`연결 실패: ${error.message}`, true); }
}
$('join-btn').addEventListener('click', async () => {
  const name = $('nickname').value.trim();
  if (!room || !room.is_open) return status('현재 참가할 수 없는 게임입니다.', true);
  if (!name) return status('닉네임을 입력해주세요.', true);
  $('join-btn').disabled = true;
  try {
    const { count, error: countError } = await db.from('poker_players')
      .select('id', { count: 'exact', head: true }).eq('room_id', room.id);
    if (countError) throw countError;
    if (count >= 9) throw new Error('이 게임은 최대 9명까지 참가할 수 있습니다.');
    const { data: auth } = await db.auth.getUser();
    const { data, error } = await db.from('poker_players').insert({ room_id: room.id, user_id: auth.user.id, name, buyin: 1 }).select().single();
    if (error) throw error;
    player = data; showPlayer();
  } catch (error) { status(`참가 실패: ${error.message}`, true); }
  finally { $('join-btn').disabled = false; }
});
$('nickname').addEventListener('keydown', e => { if (e.key === 'Enter') $('join-btn').click(); });
$('rebuy-btn').addEventListener('click', async () => {
  if (!rebuyOpen()) return status('리바인 마감 레벨이 지났습니다.', true);
  if (rebuyLimitReached()) return status('설정된 리바인 최대 횟수에 도달했습니다.', true);
  if (!player || !confirm(`리바인할까요?\n확인하면 바인 횟수가 ${player.buyin + 1}회가 됩니다.`)) return;
  $('rebuy-btn').disabled = true;
  try {
    const { data, error } = await db.rpc('change_poker_buyin', { p_player_id: player.id, p_delta: 1 });
    if (error) throw error;
    player = data; showPlayer(); status('리바인이 반영되었습니다.');
  } catch (error) { status(`리바인 실패: ${error.message}`, true); }
  finally { $('rebuy-btn').disabled = false; }
});
$('refresh-btn').addEventListener('click', async () => {
  try { const { data } = await db.auth.getUser(); await fetchPlayer(data.user.id); }
  catch (error) { status(`새로고침 실패: ${error.message}`, true); }
});
$('leave-btn').addEventListener('click', async () => {
  if (!player || !confirm('이 게임에서 나갈까요?\n현재 참가 정보와 바인 기록이 삭제됩니다.')) return;
  $('leave-btn').disabled = true;
  try {
    const leavingId = player.id;
    const { error } = await db.from('poker_players').delete().eq('id', leavingId);
    if (error) throw error;
    showJoin('게임에서 나왔습니다. 같은 방에 다시 참가할 수 있습니다.');
  } catch (error) { status(`나가기 실패: ${error.message}`, true); }
  finally { $('leave-btn').disabled = false; }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') calibrateServerClock().then(refreshRoomState);
});
init();
</script>
</body>
</html>
